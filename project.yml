name: SpaceLens
configs:
  Debug: debug
  Release: release
  Direct: release
options:
  bundleIdPrefix: com.lukemclaughlin
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 24UCS53598
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  SpaceLens:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.spacelens
        PRODUCT_NAME: SpaceLens
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: SpaceLens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Storage Atlas
        INFOPLIST_KEY_CFBundleName: Storage Atlas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Luke McLaughlin. All rights reserved."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Storage Atlas needs access to scan your Desktop for large files."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Storage Atlas needs access to scan your Documents for large files."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Storage Atlas needs access to scan your Downloads for large files."
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Direct:
          PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.spacelens.direct
          INFOPLIST_KEY_CFBundleDisplayName: SpaceLens
          INFOPLIST_KEY_CFBundleName: SpaceLens
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: ""
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  SpaceLens:
    build:
      targets:
        SpaceLens: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/StorageAtlas.storekit
    archive:
      config: Release
